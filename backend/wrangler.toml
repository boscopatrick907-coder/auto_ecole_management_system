name = "driving-schools-api"
main = "src/tenant/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
# Secrets: DATABASE_URL, AUTH_DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL,
# TRUSTED_ORIGINS, TURNSTILE_SECRET_KEY, OFFLINE_PRIVATE_KEY_PEM,
# R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME.
# Restricted application and identity logins only; never the migration owner.
# Run the Worker next to the Neon database: each request makes several
# sequential queries, so database latency dominates response time.
[placement]
region = "aws:us-east-2"
# Recommended: pooled, low-latency connections. Create with
#   wrangler hyperdrive create aem-app --connection-string="<restricted app login URL>"
#   wrangler hyperdrive create aem-auth --connection-string="<restricted identity login URL>"
# then uncomment; context.ts uses APP_DB / AUTH_DB automatically when present.
[[hyperdrive]]
binding = "APP_DB"
id = "3ca7b0b9fce04553b33c4006133c1701"
[[hyperdrive]]
binding = "AUTH_DB"
id = "6bd1874759434e9b910e68c3fcb9f3dc"
[[ratelimits]]
name = "SIGNUP_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
[vars]
ENVIRONMENT = "production"
