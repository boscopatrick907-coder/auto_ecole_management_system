# Staging only. Deploy UI and API together to keep authentication same-origin.
name = "driving-schools-staging"
main = "src/tenant/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../frontend/dist/auto-ecole-la-marseillaise-pwa/browser"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[ratelimits]]
name = "SIGNUP_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[vars]
ENVIRONMENT = "staging"
# Add secrets/bindings securely to this worker before using authenticated flows.
# DATABASE_URL and AUTH_DATABASE_URL must use separate restricted Neon logins.
# BETTER_AUTH_URL and TRUSTED_ORIGINS must match the deployed HTTPS origin.
