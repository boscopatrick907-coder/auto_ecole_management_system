name: PostgreSQL backup to R2
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: database-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 18 client matching Neon production
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          pg_dump --version
      - name: Back up to private R2 bucket
        run: |
          # If a single ENVIRONMENT secret with .env contents was provided, source it safely
          if [ -n "${ENV_SECRET_BLOB:-}" ]; then
            printf '%s\n' "$ENV_SECRET_BLOB" > /tmp/env.blob
            set -a
            # shellcheck disable=SC1091
            source /tmp/env.blob 2>/dev/null || true
            set +a
            rm -f /tmp/env.blob
          fi
          # Export variables with fallback to .env aliases
          export BACKUP_DATABASE_URL="${BACKUP_DATABASE_URL:-${DATABASE_URL:-}}"
          export R2_ACCOUNT_ID="${R2_ACCOUNT_ID:-}"
          export R2_BACKUP_BUCKET="${R2_BACKUP_BUCKET:-${R2_BUCKET_NAME:-}}"
          export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-${R2_BACKUP_ACCESS_KEY_ID:-${R2_ACCESS_KEY_ID:-}}}"
          export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-${R2_BACKUP_SECRET_ACCESS_KEY:-${R2_SECRET_ACCESS_KEY:-}}}"
          export AWS_DEFAULT_REGION="auto"
          bash scripts/backup-to-r2.sh
        env:
          ENV_SECRET_BLOB: ${{ secrets.ENVIRONMENT }}
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
