name: Multi-school frontend and API
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local_tenant_test
        ports: ['55436:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm audit --omit=dev --prefix backend
      - run: npm audit --omit=dev --prefix frontend
      - run: npm run build --prefix backend
      - run: npm run build:worker --prefix backend
      - run: npm run test:tenant --prefix backend
      - run: npm run lint --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend
        env:
          PLAYWRIGHT_USE_BUNDLED: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-results
          path: frontend/test-results
